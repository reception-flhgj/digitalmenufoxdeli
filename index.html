<!doctype html>
<html lang="en" class="h-full">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FOX DELI – Digital Menu</title>
  <script src="/_sdk/element_sdk.js"></script>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&amp;family=DM+Sans:wght@300;400;500;600&amp;display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #535486;
      --surface: #ffffff;
      --text: #1a2e35;
      --accent: #2a7f8a;
      --action: #e05c2a;
      --action2: #5b3a8e;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text);
    }

    h1,
    h2,
    h3,
    .brand {
      font-family: 'Playfair Display', serif;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 3px;
    }

    .cat-pill.active {
      background-color: var(--accent);
      color: #fff;
      box-shadow: 0 4px 14px rgba(42, 127, 138, 0.35);
    }

    .cat-pill {
      transition: all .2s ease;
      white-space: nowrap;
    }

    .cat-pill:hover {
      background-color: var(--accent);
      color: #fff;
    }

    .menu-card {
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .menu-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.12);
    }

    #cart-panel {
      transition: transform .3s cubic-bezier(.4, 0, .2, 1);
      max-height: 100%;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      right: 0;
      height: 100%;
      z-index: 40;
    }

    #cart-panel.hidden-panel {
      transform: translateX(100%);
      visibility: hidden;
    }

    #cart-panel.visible-panel {
      transform: translateX(0);
      visibility: visible;
    }

    @media (max-width: 640px) {
      #cart-panel {
        width: 90%;
        max-width: 320px;
        height: auto;
        max-height: 85vh;
        left: 50%;
        right: auto;
        top: 50%;
        transform: translate(-50%, -50%) translateX(100%);
        border-radius: 1.5rem;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }

      #cart-panel.hidden-panel {
        transform: translate(-50%, -50%) translateX(100%);
        visibility: hidden;
      }

      #cart-panel.visible-panel {
        transform: translate(-50%, -50%) translateX(0);
        visibility: visible;
      }
    }

    #cart-overlay {
      transition: opacity .3s ease;
    }

    #option-modal {
      transition: opacity .2s ease;
    }

    @keyframes badge-pop {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.4);
      }

      100% {
        transform: scale(1);
      }
    }

    .badge-pop {
      animation: badge-pop .3s ease;
    }

    .hero-gradient {
      background: linear-gradient(135deg, #535486 0%, #1a7a88 50%, #535486 100%);
    }

    .allergen-tag {
      font-size: 16px;
      background: transparent;
      border: none;
      padding: 0;
      cursor: help;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease;
    }

    .allergen-tag:hover {
      transform: scale(1.2);
    }

    .price-text {
      color: var(--action);
      font-weight: 600;
    }

    .section-hidden {
      display: none !important;
    }

    .sticky-header {
      backdrop-filter: blur(10px);
      background: rgba(171, 224, 228, 0.92);
    }

    .btn-action {
      background-color: var(--action);
      color: #fff;
      transition: background .2s;
    }

    .btn-action:hover {
      background-color: #c44f22;
    }

    .btn-accent {
      background-color: var(--accent);
      color: #fff;
      transition: background .2s;
    }

    .btn-accent:hover {
      background-color: #1f6570;
    }

    .qty-btn {
      background: var(--bg);
      border: 1.5px solid var(--accent);
      color: var(--accent);
      border-radius: 50%;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      cursor: pointer;
      transition: all .15s;
    }

    .qty-btn:hover {
      background: var(--accent);
      color: #fff;
    }

    .opt-radio {
      display: none;
    }

    .opt-label {
      cursor: pointer;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1.5px solid #ccc;
      font-size: 13px;
      transition: all .15s;
      user-select: none;
    }

    .opt-radio:checked+.opt-label {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    #toast {
      transition: opacity .3s, transform .3s;
    }

    #option-modal {
      display: flex !important;
      align-items: center;
      justify-content: center;
      position: fixed;
      inset: 0;
      z-index: 50;
      padding: 16px;
      background: rgba(0, 0, 0, 0.5);
    }

    #option-modal.hidden {
      display: none !important;
    }

    #option-modal>div {
      max-height: 75vh;
      width: 100%;
      max-width: 24rem;
      border-radius: 1.5rem;
      overflow-y: auto;
      margin: auto;
    }
  </style>
  <style>
    body {
      box-sizing: border-box;
    }
  </style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
</head>

    function buildCategoryPills() {
      const strip = document.getElementById("cat-strip");
      strip.innerHTML = "";
      CATEGORIES.forEach(cat => {
        const btn = document.createElement("button");
        btn.className = "cat-pill flex-shrink-0 px-4 py-1.5 rounded-full text-sm font-medium border border-transparent bg-white bg-opacity-60" + (cat.id === "all" ? " active" : "");
        btn.setAttribute("data-cat", cat.id);
        btn.textContent = typeof cat.label === "string" ? cat.label : cat.label[LANG];
        btn.onclick = function () { filterCategory(cat.id); };
        strip.appendChild(btn);
      });
    }

    function filterCategory(id) {
      activeCategory = id;
      document.querySelectorAll(".cat-pill").forEach(p => {
        p.classList.toggle("active", p.getAttribute("data-cat") === id);
      });
      document.querySelectorAll(".menu-section").forEach(sec => {
        const secId = sec.getAttribute("data-section");
        sec.classList.toggle("section-hidden", id !== "all" && id !== secId);
      });
      lucide.createIcons();
    }

        wrap.innerHTML = "<p class=\"font-bold mb-2\" style=\"color:#856404\">⚠️ " + $("allergenInfo") + "</p><div class=\"flex flex-wrap gap-2\">" + allergens.map(function (a) { return "<div class=\"flex items-center gap-1\"><span class=\"text-base\">" + A(a) + "</span><span>" + L(a) + "</span></div>"; }).join("") + "</div>";
        body.appendChild(wrap);
      }

      document.getElementById("modal-qty").textContent = "1";
      const modal = document.getElementById("option-modal");
      modal.classList.remove("hidden");
      modal.style.display = "flex";
      lucide.createIcons();
    }

    function buildRadioGroup(label, name, options, required) {
      const wrap = document.createElement("div");
      wrap.className = "mb-4";
      const lbl = document.createElement("p");
      lbl.className = "text-xs font-bold uppercase tracking-wide mb-2";
      lbl.style.color = "var(--accent)";
      lbl.textContent = label;
      wrap.appendChild(lbl);
      const row = document.createElement("div");
      row.className = "flex flex-wrap gap-2";
      options.forEach(function (opt, i) {
        const uid = "opt_" + name + "_" + i + "_" + Date.now();
        const inp = document.createElement("input");
        inp.type = "radio";
        inp.name = "modal_" + name;
        inp.value = opt.v;
        inp.id = uid;
        inp.className = "opt-radio";
        (function (val) {
          inp.onchange = function () { modalOptions[name] = val; updateModalPrice(); };
        })(opt.v);
        const lbl2 = document.createElement("label");
        lbl2.htmlFor = uid;
        lbl2.className = "opt-label";
        lbl2.textContent = opt.l;
        row.appendChild(inp);
        row.appendChild(lbl2);
      });
      wrap.appendChild(row);
      return wrap;
    }

    function updateModalPrice() {
      let p = modalItem ? modalItem.price : 0;
      if (modalOptions.extra_shot) p += 10000;
      if (modalOptions.extra_rice) p += 10000;
      if (modalOptions.extra_egg) p += 10000;
      document.getElementById("modal-price").textContent = fmt(p * modalQty);
    }

    function changeModalQty(d) {
      modalQty = Math.max(1, modalQty + d);
      document.getElementById("modal-qty").textContent = modalQty;
      updateModalPrice();
    }

    function closeModal() {
      const modal = document.getElementById("option-modal");
      modal.classList.add("hidden");
      modal.style.display = "none";
      modalItem = null;
    }

    function addToCartFromModal() {
      if (!modalItem) return;
      if (modalItem.hotice && !modalOptions.temp) {
        showToast($("selectTemp"), true);
        return;
      }

      let price = modalItem.price;
      let optParts = [];
      if (modalOptions.temp) optParts.push(modalOptions.temp);
      if (modalOptions.sugar) optParts.push("Sugar: " + modalOptions.sugar);
      if (modalOptions.extra_shot) { price += 10000; optParts.push("+Extra Shot"); }
      if (modalOptions.extra_rice) { price += 10000; optParts.push("+White Rice"); }
      if (modalOptions.extra_egg) { price += 10000; optParts.push("+Egg"); }

      const optStr = optParts.join(" | ");

      const existing = cart.find(function (c) { return c.name === modalItem.name && c.optStr === optStr; });
      if (existing) {
        existing.qty += modalQty;
        existing.price = price;
      } else {
        cart.push({ id: ++cartIdCounter, name: modalItem.name, price: price, qty: modalQty, optStr: optStr });
      }

      closeModal();
      updateCartUI();
      showToast(modalItem.name + " added!");
    }

    function updateCartUI() {
      const total = cart.reduce(function (s, c) { return s + c.price * c.qty; }, 0);
      const count = cart.reduce(function (s, c) { return s + c.qty; }, 0);

      const badge = document.getElementById("cart-badge");
      if (count > 0) {
        badge.textContent = count > 99 ? "99+" : count;
        badge.classList.remove("hidden");
        badge.classList.add("badge-pop");
        setTimeout(function () { badge.classList.remove("badge-pop"); }, 300);
      } else {
        badge.classList.add("hidden");
      }

      document.getElementById("cart-total").textContent = fmt(total);

      const container = document.getElementById("cart-items");
      const empty = document.getElementById("cart-empty");
      if (cart.length === 0) {
        empty.style.display = "";
        container.querySelectorAll(".cart-row").forEach(function (e) { e.remove(); });
      } else {
        empty.style.display = "none";
        const existing = new Map([...container.querySelectorAll(".cart-row")].map(function (e) { return [parseInt(e.dataset.cartId), e]; }));
        let prevEl = empty;
        cart.forEach(function (item) {
          if (existing.has(item.id)) {
            const el = existing.get(item.id);
            el.querySelector(".cart-item-qty").textContent = item.qty;
            el.querySelector(".cart-item-total").textContent = fmt(item.price * item.qty);
            existing.delete(item.id);
            prevEl = el;
          } else {
            const el = document.createElement("div");
            el.className = "cart-row bg-gray-50 rounded-xl p-3 border border-gray-100";
            el.dataset.cartId = item.id;
            el.innerHTML = "<div class=\"flex justify-between items-start gap-2\"><div class=\"flex-1 min-w-0\"><p class=\"text-sm font-semibold truncate\" style=\"color:var(--text)\">" + item.name + "</p>" + (item.optStr ? "<p class=\"text-xs text-gray-400 mt-0.5\">" + item.optStr + "</p>" : "") + "</div><button class=\"remove-btn text-gray-300 hover:text-red-400 flex-shrink-0\"><i data-lucide=\"trash-2\" style=\"width:14px;height:14px\"></i></button></div><div class=\"flex items-center justify-between mt-2\"><div class=\"flex items-center gap-2\"><div class=\"qty-btn minus-btn\">−</div><span class=\"cart-item-qty font-bold text-sm w-5 text-center\">" + item.qty + "</span><div class=\"qty-btn plus-btn\">+</div></div><span class=\"cart-item-total price-text text-sm\">" + fmt(item.price * item.qty) + "</span></div>";
            (function (cartItem) {
              el.querySelector(".remove-btn").addEventListener("click", function () { removeFromCart(cartItem.id); });
              el.querySelector(".minus-btn").addEventListener("click", function () { changeCartQty(cartItem.id, -1); });
              el.querySelector(".plus-btn").addEventListener("click", function () { changeCartQty(cartItem.id, 1); });
            })(item);
            prevEl.after(el);
            prevEl = el;
            existing.delete(item.id);
          }
        });
        existing.forEach(function (el) { el.remove(); });
      }
      lucide.createIcons();
    }

    function changeCartQty(id, d) {
      const item = cart.find(function (c) { return c.id === id; });
      if (!item) return;
      item.qty = Math.max(0, item.qty + d);
      if (item.qty === 0) cart = cart.filter(function (c) { return c.id !== id; });
      updateCartUI();
    }

    function removeFromCart(id) {
      cart = cart.filter(function (c) { return c.id !== id; });
      updateCartUI();
    }

    function toggleCart() {
      cartOpen = !cartOpen;
      const panel = document.getElementById("cart-panel");
      const overlay = document.getElementById("cart-overlay");
      if (cartOpen) {
        overlay.classList.remove("hidden");
        panel.classList.remove("hidden-panel");
        panel.classList.add("visible-panel");
      } else {
        overlay.classList.add("hidden");
        panel.classList.remove("visible-panel");
        panel.classList.add("hidden-panel");
      }
      lucide.createIcons();
    }

    function checkout() {
      const guestName = document.getElementById("guest-name").value.trim();
      const locDetail = document.getElementById("location-detail").value.trim();
      const locType = document.querySelector('input[name="location_type"]:checked');
      const notes = document.getElementById("order-notes").value.trim();

      if (!guestName) {
        showToast($("enterName"), true);
        document.getElementById("guest-name").focus();
        return;
      }
      if (!locType) {
        showToast($("selectLocation"), true);
        return;
      }
      if (!locDetail) {
        showToast($("enterTableRoom"), true);
        document.getElementById("location-detail").focus();
        return;
      }
      if (cart.length === 0) {
        showToast($("cartEmpty2"), true);
        return;
      }

      const locLabel = locType.value === "table" ? $("table") : $("room");
      let msg = "🦊 *FOX DELI ORDER*\n";
      msg += "👤 " + $("name") + ": " + guestName + "\n";
      msg += "📍 " + locLabel + ": " + locDetail + "\n";
      msg += "\n*🛒 " + $("order") + ":*\n";
      cart.forEach(function (item, i) {
        msg += (i + 1) + ". " + item.name;
        if (item.optStr) msg += " (" + item.optStr + ")";
        msg += " x" + item.qty + " — " + fmt(item.price * item.qty) + "\n";
      });
      const total = cart.reduce(function (s, c) { return s + c.price * c.qty; }, 0);
      msg += "\n💰 *Total: " + fmt(total) + "*";
      if (notes) msg += "\n\n📝 " + $("notes") + ": " + notes;
      msg += "\n\n_" + $("thankYou") + "_";

      const waNum = WA_NUMBER || (window.elementSdk && window.elementSdk.config ? window.elementSdk.config.whatsapp_number : "") || "";
      const url = "https://wa.me/" + waNum + "?text=" + encodeURIComponent(msg);
      window.open(url, "_blank", "noopener,noreferrer");
    }

    let toastTimer;
    function showToast(msg, isError) {
      isError = isError || false;
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.style.background = isError ? "#dc2626" : "#1a2e35";
      t.style.opacity = "1";
      t.style.transform = "translateX(-50%) translateY(0)";
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () {
        t.style.opacity = "0";
        t.style.transform = "translateX(-50%) translateY(10px)";
      }, 2500);
    }

    function updateLocationUI() {
      const tableWrap = document.getElementById("loc-table-wrap");
      const roomWrap = document.getElementById("loc-room-wrap");
      const tableChecked = document.getElementById("loc-table").checked;
      const roomChecked = document.getElementById("loc-room").checked;
      tableWrap.style.borderColor = tableChecked ? "var(--accent)" : "#e5e7eb";
      roomWrap.style.borderColor = roomChecked ? "var(--accent)" : "#e5e7eb";

      detail.placeholder = tableChecked ? "Table number (e.g. Table 5)" : "Room number (e.g. Room 302)";
    }

      restaurant_name: "FOX DELI",
      restaurant_tagline: "Taste the Experience",
      whatsapp_number: "",
      footer_text: "Thank you for dining with us!",

      surface_color: "#ffffff",
      text_color: "#1a2e35",
      accent_color: "#2a7f8a",
      action_color: "#e05c2a",
    };

    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig: defaultConfig,
        onConfigChange: async function (config) {
          const name = config.restaurant_name || defaultConfig.restaurant_name;
          const tagline = config.restaurant_tagline || defaultConfig.restaurant_tagline;
          document.getElementById("hero-name").textContent = name;
          document.getElementById("hero-tagline").textContent = tagline;
          document.getElementById("header-name").textContent = name;
          document.getElementById("header-tagline").textContent = tagline;
          document.title = name + " – Digital Menu";

          document.documentElement.style.setProperty("--bg", config.bg_color || defaultConfig.bg_color);
          document.documentElement.style.setProperty("--surface", config.surface_color || defaultConfig.surface_color);
          document.documentElement.style.setProperty("--text", config.text_color || defaultConfig.text_color);
          document.documentElement.style.setProperty("--accent", config.accent_color || defaultConfig.accent_color);
          document.documentElement.style.setProperty("--action", config.action_color || defaultConfig.action_color);
        },
        mapToCapabilities: function (config) {
          return {
            recolorables: [
              { get: function () { return config.bg_color || defaultConfig.bg_color; }, set: function (v) { config.bg_color = v; window.elementSdk.setConfig({ bg_color: v }); } },
              { get: function () { return config.surface_color || defaultConfig.surface_color; }, set: function (v) { config.surface_color = v; window.elementSdk.setConfig({ surface_color: v }); } },
              { get: function () { return config.text_color || defaultConfig.text_color; }, set: function (v) { config.text_color = v; window.elementSdk.setConfig({ text_color: v }); } },
              { get: function () { return config.accent_color || defaultConfig.accent_color; }, set: function (v) { config.accent_color = v; window.elementSdk.setConfig({ accent_color: v }); } },
              { get: function () { return config.action_color || defaultConfig.action_color; }, set: function (v) { config.action_color = v; window.elementSdk.setConfig({ action_color: v }); } },
            ],
            borderables: [],
            fontEditable: undefined,
            fontSizeable: undefined,
          };
        },
        mapToEditPanelValues: function (config) {
          return new Map([
            ["restaurant_name", config.restaurant_name || defaultConfig.restaurant_name],
            ["restaurant_tagline", config.restaurant_tagline || defaultConfig.restaurant_tagline],
            ["whatsapp_number", config.whatsapp_number || defaultConfig.whatsapp_number],
            ["footer_text", config.footer_text || defaultConfig.footer_text],
          ]);
        },
      });
    }

    init();
  </script>
